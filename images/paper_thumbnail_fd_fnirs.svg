<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Animated NEURECA lab logo</title>
  <desc id="desc">A scalable NEURECA signal mark with a gently pulsing centre node.</desc>
  <style>
    .node {
      transform-box: fill-box;
      transform-origin: center;
      animation: neureca-pulse 3.6s ease-in-out infinite;
    }
    .signal {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      animation: neureca-draw 2.4s ease-out forwards;
    }
    @keyframes neureca-pulse {
      0%, 55%, 100% { transform: scale(1); opacity: 1; }
      68% { transform: scale(1.45); opacity: .72; }
      82% { transform: scale(1); opacity: 1; }
    }
    @keyframes neureca-draw {
      to { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .signal { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <rect width="800" height="600" rx="36" fill="#f5f8f7"/>
  <g transform="translate(160 60) scale(10)">
    <path class="signal" d="M5 1.2L43 46.8" fill="none" stroke="#685564" stroke-width="2.7" stroke-linecap="square"/>
    <path d="M7 24H41" fill="none" stroke="#455452" stroke-width="2.7" stroke-linecap="butt"/>
    <path d="M9.25 6V42M38.75 6V42" fill="none" stroke="#191b1b" stroke-width="2.7" stroke-linecap="square"/>
    <circle class="node" cx="24" cy="24" r="2.8" fill="#685564"/>
  </g>
</svg>
