<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">NEURECA logo</title>
  <desc id="description">The H and N monogram beside NEURECA, Hyojin Park’s Research Group, and Sound, Vision, Meaning.</desc>
  <g transform="translate(10 8) scale(3.4)">
    <defs>
      <clipPath id="diagonal-inner"><rect x="10" y="4" width="28" height="40"/></clipPath>
      <clipPath id="mark-outer"><rect x="7.85" y="4.65" width="32.3" height="38.7"/></clipPath>
    </defs>
    <path d="M5 1.2L43 46.8" fill="none" stroke="#685564" stroke-width="2.7" stroke-linecap="square" clip-path="url(#diagonal-inner)" transform="rotate(2 24 24)"/>
    <path d="M7 24H41" fill="none" stroke="#455452" stroke-width="2.7" stroke-linecap="butt" clip-path="url(#mark-outer)"/>
    <path d="M9.25 6V42M38.75 6V42" fill="none" stroke="#191b1b" stroke-width="2.7" stroke-linecap="square"/>
    <circle cx="24" cy="24" r="2.8" fill="#685564"/>
  </g>
  <g transform="translate(168 0)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="0" y="70" font-size="48" font-weight="700" letter-spacing="2.4" fill="#191b1b">NEURECA</text>
    <text x="1" y="112" font-size="16" letter-spacing="1.6" fill="#5d6563">HYOJIN PARK’S RESEARCH GROUP</text>
    <text x="1" y="142" font-size="15.5" letter-spacing="1.35" fill="#191b1b">SOUND · VISION · MEANING</text>
  </g>
</svg>
